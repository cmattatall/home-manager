add_newline = false
format = '$status${env_var.SSH_CONNECTION}([\[${custom.username}${custom.root_username}$hostname$os\]](220) )$directory$git_branch$nix_shell$aws$character'

[env_var.SSH_CONNECTION]
format = '[ssh:](205)'

[custom.username]
command = '''
user=${USER:-$(id -un)}
if [ "$user" != root ]; then
    printf "%s" "${user:0:5}"
fi
'''
shell = ['bash', '--noprofile', '--norc']
when = true
format = '($output@)'

[custom.root_username]
when = '[ "${USER:-$(id -un)}" = root ]'
shell = ['bash', '--noprofile', '--norc']
format = '[root](red)@'

[hostname]
ssh_only = false
format = '$hostname'

[os]
disabled = true
format = ' \($name\)'

[directory]
format = '[$path]($style) '
style = 'purple'
truncation_length = 0
truncate_to_repo = false

[git_branch]
format = '[\($branch\)]($style) '
style = 'green'

[nix_shell]
symbol = '❄️ '
format = '[$symbol]($style)'
style = 'cyan'

[aws]
format = '([\($profile\)]($style) )([\[$duration\]]($style) )'
style = 'yellow'
force_display = true

[aws.profile_aliases]
prod = '🚨 prod 🚨'

[status]
disabled = false
format = '[\[$status\]]($style) '
style = 'red'

[character]
success_symbol = '\$'
error_symbol = '\$'
